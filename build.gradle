plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = "1.0.0"
group = "com.anon"

base {
    archivesName = "FakeTotem"
}

def fabricApiVersion = providers.gradleProperty('fabricApiVersion').getOrElse('0.119.3+1.21.4')
def loaderVersion = providers.gradleProperty('loaderVersion').getOrElse('0.16.9')

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.1:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
}

// одключаем Access Widener
loom {
    accessWidenerPath = file("src/main/resources/faketotem.accesswidener")
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    // ринудительно устанавливаем кодировку UTF-8 для компилятора
    it.options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}