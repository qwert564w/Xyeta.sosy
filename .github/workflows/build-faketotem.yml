name: Build FakeTotem

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Resolve Fabric API version
        id: fabric_api
        run: |
          set -euo pipefail
          META=$(curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml || true)
          VERSION=$(printf '%s' "$META" | grep -oP '(?<=<version>)0\.[0-9]+\.[0-9]+\+1\.21\.4(?=</version>)' | tail -n1 || true)
          if [ -z "$VERSION" ]; then VERSION="0.119.3+1.21.4"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved Fabric API: $VERSION"

      - name: Build
        run: gradle build --no-daemon --stacktrace -PfabricApiVersion=${{ steps.fabric_api.outputs.version }}

      - name: Locate production jar
        id: jar
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' -printf '%p\n' | sort | head -n1)"
          if [ -z "${JAR:-}" ]; then
            echo "No production jar found" >&2
            ls -R build/libs || true
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Production jar: $JAR"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          JAR="${{ steps.jar.outputs.path }}"
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release delete v1.0.0 --yes --cleanup-tag
          fi
          gh release create v1.0.0 "$JAR" --title "FakeTotem 1.0.0" --notes "Compiled by GitHub Actions"